[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-pr"
version = "0.1.0"
description = "Local contribution preflight and targeted mutation testing (incremental MVP)"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
ghost = "ghost_pr.cli:main"

[tool.setuptools.packages.find]
include = ["ghost_pr*"]
